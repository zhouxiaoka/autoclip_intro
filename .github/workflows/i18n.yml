name: Website language checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  translations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/i18n.test.cjs
