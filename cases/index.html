<body class="cases-page">

<header class="nav">
  <div class="container nav-in">
    <a class="brand serif" href="../" data-home aria-label="AutoClip"><img src="../logo.svg" alt="">AutoClip</a>
    <div class="nav-right">
      <div class="lang">
        <select id="language" aria-label="Language / 语言">
          <option value="zh" lang="zh-CN">简体中文</option>
          <option value="en" lang="en">English</option>
          <option value="ja" lang="ja">日本語</option>
          <option value="ko" lang="ko">한국어</option>
          <option value="es" lang="es">Español</option>
          <option value="pt" lang="pt-BR">Português (Brasil)</option>
          <option value="ru" lang="ru">Русский</option>
          <option value="fr" lang="fr">Français</option>
        </select>
      </div>
      <a class="btn btn-primary btn-sm" href="../#download" data-home data-copy="download">下载</a>
    </div>
  </div>
</header>

<main class="stage cases-main">
  <div class="container">
    <a class="back" href="../" data-home data-copy="back">‹ 首页</a>
    <span class="eyebrow" data-copy="eyebrow">案例库</span>
    <h1 data-copy="h1">AutoClip 做出来的真实成片</h1>
    <p class="lede" data-copy="lede"></p>
    <p class="cases-cta"><a class="btn btn-secondary btn-sm" href="https://github.com/zhouxiaoka/autoclip/discussions/new?category=show-and-tell" target="_blank" rel="noopener" data-copy="submit">投稿你的成片</a></p>
  </div>

</main>

  <div class="container footer-in">
    <a class="brand serif" href="../" data-home><img src="../logo.svg" alt="">AutoClip</a>
    <nav class="footer-links"><a href="https://github.com/zhouxiaoka/autoclip" target="_blank" rel="noopener">GitHub</a><a href="../analytics/" data-copy="privacy">隐私政策</a></nav>
    <span>© 2025–2026 AutoClip · MIT</span>
  </div>
</footer>

<script>
(function(){
  var COPY = {
    zh: {title:'案例库 | AutoClip', download:'下载', back:'‹ 首页', eyebrow:'案例库', h1:'AutoClip 做出来的真实成片',
      lede:'每条都是贴一个链接后自动挑片、取景、翻译和包装的原样输出，没有人工修改。点开看它为目标平台准备的交付包。按平台或原片筛选；用 AutoClip 做出了好片子，欢迎投稿。',
      submit:'投稿你的成片', privacy:'隐私政策'},
    en: {title:'Case library | AutoClip', download:'Download', back:'‹ Home', eyebrow:'Case library', h1:'Real clips made by AutoClip',
      lede:'Each one is untouched output from a single pasted link: picked, framed, translated and packaged automatically. Open a clip to see the delivery kit for its platform. Filter by platform or source, and share your own.',
      submit:'Share your clips', privacy:'Privacy'}
  };
  var ATTR = {zh:'zh-CN', en:'en', ja:'ja', ko:'ko', es:'es', pt:'pt-BR', ru:'ru', fr:'fr'};
  function apply(lang){
    if (!ATTR[lang]) lang = 'en';
    var d = COPY[lang] || COPY.en;
    document.documentElement.lang = ATTR[lang];
    document.title = d.title;
    document.querySelectorAll('[data-copy]').forEach(function(el){ el.textContent = d[el.getAttribute('data-copy')]; });
    document.querySelectorAll('[data-home]').forEach(function(a){ var u = new URL(a.getAttribute('href'), location.href); u.searchParams.set('lang', lang); a.href = u.href; });
    document.getElementById('language').value = lang;
    try { localStorage.setItem('autoclip.lang', lang); } catch(e){}
  }
  var saved = null; try { saved = localStorage.getItem('autoclip.lang'); } catch(e){}
  var q = new URLSearchParams(location.search).get('lang');
  var nav = (navigator.languages || [navigator.language || 'en']).map(function(l){ return l.toLowerCase().split('-')[0]; }).filter(function(l){ return ATTR[l]; })[0];
  apply(ATTR[q] ? q : ATTR[saved] ? saved : nav || 'en');
  document.getElementById('language').addEventListener('change', function(e){
    apply(e.target.value);
    var u = new URL(location.href); u.searchParams.set('lang', e.target.value); history.replaceState(null, '', u);
  });
})();
</script>
<script src="../assets/library.js"></script>

<script src="../assets/analytics.js"></script>
